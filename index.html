<style>
:root{--bg:#f4f5f7;--surface:#ffffff;--surface-2:#eceef1;--line:#dfe2e7;--ink:#171a1f;--muted:#69707a;--faint:#a4abb4;--go:#1f9d54;--go-ink:#ffffff;--warn:#e08a1e;--bad:#d64545;--accent:#171a1f;--shadow:0 1px 2px rgba(20,24,31,.06),0 6px 20px rgba(20,24,31,.06);box-sizing:border-box;}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#16181d;--surface:#1e2128;--surface-2:#262a32;--line:#313742;--ink:#e8eaed;--muted:#9299a3;--faint:#6b727c;--go:#2fbf71;--warn:#f0a83a;--bad:#e5615f;--accent:#e8eaed;--shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.28);}}
:root[data-theme="dark"]{--bg:#16181d;--surface:#1e2128;--surface-2:#262a32;--line:#313742;--ink:#e8eaed;--muted:#9299a3;--faint:#6b727c;--go:#2fbf71;--warn:#f0a83a;--bad:#e5615f;--accent:#e8eaed;--shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.28);}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:16px;line-height:1.4;-webkit-font-smoothing:antialiased;overflow:hidden}
.num{font-family:"Barlow Condensed",system-ui,sans-serif;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:.2px}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
#app{position:fixed;top:0;bottom:0;left:0;right:0;max-width:520px;margin:0 auto;display:flex;flex-direction:column}
#view{flex:1;min-height:0;padding:env(safe-area-inset-top,0px) 16px 24px;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch}

.pbar{padding:14px 2px 0}
.pchip{display:inline-flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:7px 13px;font-size:14px;font-weight:600;box-shadow:var(--shadow)}
.pchip .pdot{width:8px;height:8px;border-radius:50%;background:var(--go)}
.pchip .pcar{color:var(--muted);font-size:11px}

.hd{padding:12px 2px 6px}
.hd .tag{font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:40px;line-height:.95;letter-spacing:.5px}
.hd .sub{color:var(--muted);font-size:13.5px;margin-top:4px}

.home-eyebrow{color:var(--faint);font-size:11.5px;letter-spacing:1.6px;font-weight:700;margin:14px 2px 2px}
.home-wk{font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:54px;line-height:.9}
.home-due{color:var(--muted);font-size:13.5px;margin-top:6px}
.home-lifts{margin:16px 0 8px}
.hl{padding:11px 2px;border-bottom:1px solid var(--line)}
.hl:last-child{border-bottom:none}
.hl .r{display:flex;justify-content:space-between;align-items:baseline}
.hl .n{font-size:15px}.hl .n small{color:var(--faint);font-size:12px;margin-left:6px}
.hl .w{font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:21px}
.hl .w small{font-size:12px;color:var(--muted);font-weight:600}
.hwed{display:flex;align-items:center;gap:8px;margin-top:8px}
.hwed button{width:40px;height:38px;border-radius:9px;background:var(--surface-2);border:1px solid var(--line);font-size:20px;font-weight:700}
.big-btn{width:100%;height:56px;border-radius:14px;background:var(--go);color:var(--go-ink);font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:20px;letter-spacing:.4px;box-shadow:var(--shadow);margin-top:10px}
.big-btn:active{filter:brightness(.94)}
.ghost{background:var(--surface-2);color:var(--ink);border:1px solid var(--line);box-shadow:none}
.last-line{color:var(--faint);font-size:12.5px;margin-top:16px;text-align:center}

.rtop{display:flex;justify-content:space-between;align-items:center;padding:16px 2px 2px;color:var(--muted);font-size:12.5px}
.rtop .tt{font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:17px;color:var(--ink);font-variant-numeric:tabular-nums}
.rname{font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:38px;line-height:.95;margin:6px 2px 0}
.rsets{display:flex;align-items:center;gap:10px;margin:8px 2px 0;color:var(--muted);font-size:13px}
.rsets .sd{display:flex;gap:6px}
.rsets .sd i{width:13px;height:13px;border-radius:50%;background:var(--surface-2);border:1.5px solid var(--line);display:inline-block}
.rsets .sd i.on{background:var(--go);border-color:var(--go)}
.rcard{background:var(--surface);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);padding:22px 18px 20px;margin:14px 0;text-align:center}
.rcard .lbl{color:var(--warn);font-size:12.5px;font-weight:700;letter-spacing:.5px;margin-bottom:8px}
.rcard .bw{font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:60px;line-height:.9}
.rcard .bw small{font-size:20px;color:var(--muted);font-weight:600}
.rcard .reps{color:var(--muted);font-size:14.5px;margin-top:8px}
.rcard .plates{margin-top:12px}
.repadj{display:flex;align-items:center;justify-content:center;gap:18px;margin:14px 0 6px}
.repadj button{width:50px;height:46px;border-radius:11px;border:1px solid var(--line);background:var(--surface-2);font-size:24px;font-weight:700}

function buildSteps(){var ids=P.workouts[P.next],steps=[];ids.forEach(function(id,li){var L=P.lifts[id];if(li===0){warmupsFor(L.weight).forEach(function(wu){steps.push({lift:id,kind:"warmup",weight:wu.weight,reps:wu.reps,label:wu.label});});}for(var s=0;s<L.sets;s++)steps.push({lift:id,kind:"work",weight:L.weight,target:L.reps,reps:null});});return steps;}

function completeCurrent(){var A=P.active,step=A.steps[A.idx];step.reps=(step.kind==="work")?pendReps:step.reps;var isLast=A.idx>=A.steps.length-1;if(step.kind==="work"&&!isLast){A.restUntil=Date.now()+A.restSec*1000;save();safeRender();}else advance();}

async function exportXlsx(){

    var fname=(P.name||"lifts").replace(/[^a-z0-9]+/gi,"-").toLowerCase().replace(/^-|-$/g,"")+"-5x5.xlsx";
    var blob=new Blob([bytes],{type:"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"});
    var dl=(window.claude&&window.claude.use)?await window.claude.use("downloads"):null;

  }catch(e){if(e&&e.code==="declined")return;toast("Couldn't save the file");}
}

  if(t.hasAttribute("data-pclose")){menuOpen=false;renderModal();return;}

  if(t.hasAttribute("data-padd")){var i1=document.getElementById("pnew");if(!i1||!i1.value.trim()){toast("Type a name first");return;}addProfile(i1.value);menuOpen=false;renderModal();safeRender();toast("Added "+P.name);return;}
  if(t.hasAttribute("data-paddset")){var i2=document.getElementById("pnewset");if(!i2||!i2.value.trim()){toast("Type a name first");return;}addProfile(i2.value);safeRender();toast("Added "+P.name);return;}

  if(d.prdel){if(delArm===d.prdel){var nm=S.profiles[d.prdel]?S.profiles[d.prdel].name:"";delArm=null;deleteProfile(d.prdel);mode="settings";safeRender();toast("Deleted "+nm);}else{delArm=d.prdel;renderSettings();setTimeout(function(){if(delArm){delArm=null;if(mode==="settings")renderSettings();}},3500);}return;}
