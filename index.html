<style>
:root{--bg:#06070b;--surface:#0f1118;--surface-2:#171a24;--line:#232736;--ink:#f2f5fb;--muted:#8d95ab;--faint:#5b6278;--go:#c6ff3d;--go2:#27e1ff;--go-ink:#07110a;--warn:#ffb020;--bad:#ff4d6d;--accent:#c6ff3d;--glow:rgba(198,255,61,.28);--vio:rgba(139,92,255,.22);--grid:rgba(255,255,255,.028);--glass:rgba(10,12,18,.78);--hl:rgba(255,255,255,.05);--shadow:0 1px 2px rgba(0,0,0,.5),0 12px 34px rgba(0,0,0,.5);box-sizing:border-box;color-scheme:dark;}
:root[data-skin="aurora"]{--go:#2dffc0;--go2:#8b5cff;--go-ink:#04110d;--accent:#2dffc0;--glow:rgba(45,255,192,.24);--vio:rgba(139,92,255,.28)}
:root[data-skin="neon"]{--go:#ff2bd6;--go2:#7a5cff;--go-ink:#14041a;--accent:#ff5be0;--glow:rgba(255,43,214,.28);--vio:rgba(60,140,255,.24)}
:root[data-skin="glass"]{--bg:#080a16;--surface:rgba(255,255,255,.07);--surface-2:rgba(255,255,255,.1);--line:rgba(255,255,255,.16);--ink:#f7f9ff;--muted:#b3bbd6;--faint:#7c86a6;--go:#7ee8fa;--go2:#c58cff;--go-ink:#06101a;--accent:#7ee8fa;--glow:rgba(126,232,250,.35);--vio:rgba(197,140,255,.3);--grid:transparent;--glass:rgba(255,255,255,.07);--hl:rgba(255,255,255,.12);--shadow:0 8px 32px rgba(0,0,0,.35);--fs:normal}
:root[data-skin="brutal"]{--bg:#0a0a0a;--surface:#141414;--surface-2:#1f1f1f;--line:#4a4a4a;--ink:#ffffff;--muted:#b8b8b8;--faint:#7d7d7d;--go:#ffe600;--go2:#ffe600;--go-ink:#000000;--accent:#ffe600;--glow:transparent;--vio:transparent;--grid:transparent;--glass:#0a0a0a;--hl:transparent;--shadow:none;--fs:normal}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:16px;line-height:1.4;-webkit-font-smoothing:antialiased;overflow:hidden;touch-action:manipulation}
.num{font-family:"Barlow Condensed",system-ui,sans-serif;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:.2px}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
#app{height:100vh;height:100dvh;max-width:520px;margin:0 auto;display:flex;flex-direction:column}
#view{flex:1;min-height:0;padding:env(safe-area-inset-top,0px) max(16px,env(safe-area-inset-right,0px)) 24px max(16px,env(safe-area-inset-left,0px));overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch}

.pbar{padding:14px 2px 0}
.pchip{display:inline-flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:7px 13px;font-size:14px;font-weight:600;box-shadow:var(--shadow)}
.pchip .pdot{width:8px;height:8px;border-radius:50%;background:var(--go)}
.pchip .pcar{color:var(--muted);font-size:11px}

.hd{padding:12px 2px 6px}
.hd .tag{font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:40px;line-height:.95;letter-spacing:.5px}
.hd .sub{color:var(--muted);font-size:13.5px;margin-top:4px}

.home-eyebrow{color:var(--faint);font-size:11.5px;letter-spacing:1.6px;font-weight:700;margin:14px 2px 2px}
.home-wk{font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:54px;line-height:.9}
.home-due{color:var(--muted);font-size:13.5px;margin-top:6px}
.home-lifts{margin:16px 0 8px}
.hl{padding:11px 2px;border-bottom:1px solid var(--line)}
.hl:last-child{border-bottom:none}
.hl .r{display:flex;justify-content:space-between;align-items:baseline}
.hl .n{font-size:15px}.hl .n small{color:var(--faint);font-size:12px;margin-left:6px}
.hl .w{font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:21px}
.hl .w small{font-size:12px;color:var(--muted);font-weight:600}
.hwed{display:flex;align-items:center;gap:8px;margin-top:8px}
.hwed button{width:40px;height:38px;border-radius:9px;background:var(--surface-2);border:1px solid var(--line);font-size:20px;font-weight:700}
.big-btn{width:100%;height:56px;border-radius:14px;background:var(--go);color:var(--go-ink);font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:20px;letter-spacing:.4px;box-shadow:var(--shadow);margin-top:10px}
.big-btn:active{filter:brightness(.94)}
.ghost{background:var(--surface-2);color:var(--ink);border:1px solid var(--line);box-shadow:none}
.last-line{color:var(--faint);font-size:12.5px;margin-top:16px;text-align:center}

.rtop{display:flex;justify-content:space-between;align-items:center;padding:16px 2px 2px;color:var(--muted);font-size:12.5px}
.rtop .tt{font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:17px;color:var(--ink);font-variant-numeric:tabular-nums}
.rname{font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:38px;line-height:.95;margin:6px 2px 0}

  if(t.hasAttribute("data-padd")){var i1=document.getElementById("pnew");if(!i1||!i1.value.trim()){toast("Type a name first");return;}addProfile(i1.value);menuOpen=false;renderModal();safeRender();toast("Added "+P.name);return;}
  if(t.hasAttribute("data-paddset")){var i2=document.getElementById("pnewset");if(!i2||!i2.value.trim()){toast("Type a name first");return;}addProfile(i2.value);safeRender();toast("Added "+P.name);return;}
  if(d.pruse){switchProfile(d.pruse);safeRender();toast("Now lifting: "+P.name);return;}
  if(d.prdel){if(delArm===d.prdel){var nm=S.profiles[d.prdel]?S.profiles[d.prdel].name:"";delArm=null;deleteProfile(d.prdel);mode="settings";safeRender();toast("Deleted "+nm);}else{delArm=d.prdel;renderSettings();setTimeout(function(){if(delArm){delArm=null;if(mode==="settings")renderSettings();}},3500);}return;}
  if(t.hasAttribute("data-start")){startWorkout();return;}
  if(t.hasAttribute("data-resume")){mode="run";safeRender();return;}
  if(t.hasAttribute("data-done")){completeCurrent();return;}
  if(t.hasAttribute("data-skiprest")){skipRest();return;}
  if(t.hasAttribute("data-repminus")){pendReps=Math.max(0,pendReps-1);safeRender();return;}
  if(t.hasAttribute("data-repplus")){var st=P.active.steps[P.active.idx];pendReps=Math.min(st.target,pendReps+1);safeRender();return;}
  if(t.hasAttribute("data-quit")){if(quitArmed){quitArmed=false;quitWorkout();}else{quitArmed=true;safeRender();setTimeout(function(){if(quitArmed){quitArmed=false;if(mode==="run")safeRender();}},3500);}return;}
  if(d.intensity){finishSession(+d.intensity);return;}
  if(t.hasAttribute("data-sumdone")){mode="home";safeRender();return;}
  if(t.hasAttribute("data-xlsx")){exportXlsx();return;}
  if(d.hedit){homeEdit=homeEdit===d.hedit?null:d.hedit;renderHome();return;}
  if(d.hwadj){var a=d.hwadj.split(":"),L=P.lifts[a[0]];L.weight=Math.max(0,roundTo(L.weight+(+a[1])*L.inc,L.inc));save();renderHome();return;}
  if(d.incadj){var c=d.incadj.split(":"),opts=[1.25,2.5,5,10],L3=P.lifts[c[0]],idx=opts.indexOf(L3.inc);if(idx<0)idx=1;idx=Math.min(opts.length-1,Math.max(0,idx+(+c[1])));L3.inc=opts[idx];save();renderSettings();return;}
  if(d.baradj){P.bar=Math.max(0,roundTo(P.bar+(+d.baradj)*2.5,2.5));save();renderSettings();return;}
  if(d.restadj){P.rest=Math.max(0,P.rest+(+d.restadj)*15);save();renderSettings();return;}
  if(d.plate){var pw=+d.plate,pi=P.plates.indexOf(pw);if(pi>=0)P.plates.splice(pi,1);else P.plates.push(pw);save();renderSettings();return;}
  if(d.theme){S.theme=d.theme;save();safeRender();return;}
  if(d.skin){S.skin=d.skin;save();safeRender();return;}
  if(t.hasAttribute("data-paste")){var tp=document.getElementById("io");try{navigator.clipboard.readText().then(function(x){if(tp&&x){tp.value=x;toast("Pasted — now tap Load now");}else toast("Clipboard is empty — copy the backup first");},function(){toast("Paste blocked — long-press the box and choose Paste");if(tp)tp.focus();});}catch(e){toast("Long-press the box and choose Paste");if(tp)tp.focus();}return;}
  if(t.hasAttribute("data-copy")){var ta=document.getElementById("io");try{ta.select();document.execCommand&&document.execCommand("copy");}catch(e){}if(navigator.clipboard){navigator.clipboard.writeText(ta.value).then(function(){toast("Backup copied");},function(){toast("Selected — copy manually");});}else toast("Selected — copy manually");return;}
  if(t.hasAttribute("data-import")){if(!importArmed){importArmed=true;renderSettings();toast("Paste the full backup, then tap Load now");return;}var ta2=document.getElementById("io"),txt=ta2?ta2.value:"";try{var obj=migrate(JSON.parse(txt));if(!validContainer(obj))throw 0;S=obj;bindProfile();importArmed=false;mode="home";save();safeRender();toast("Data loaded \u2713");}catch(e){toast("Not a valid/complete backup — paste the whole text");}return;}
  if(t.hasAttribute("data-wipe")){if(wipeArmed){wipeArmed=false;S=defaultContainer();S.updatedAt=Date.now();bindProfile();mode="home";saveLocal();if(cloudRef)pushCloud();editOpen=null;toast("Reset to defaults");safeRender();}else{wipeArmed=true;renderSettings();setTimeout(function(){if(wipeArmed){wipeArmed=false;if(mode==="settings")renderSettings();}},3500);}return;}
});
document.addEventListener("input",function(ev){var el=ev.target;if(!el||!el.dataset)return;if(el.dataset.prn){renameProfile(el.dataset.prn,el.value);}});

document.addEventListener("visibilitychange",function(){if(document.visibilityState==="visible"){try{if(audioCtx&&audioCtx.state==="suspended")audioCtx.resume();}catch(e){}if(mode==="run")requestWake();}});
function boot(){try{["900 40px Doto","800 40px Manrope","300 40px Inter"].forEach(function(f){document.fonts.load(f);});}catch(e){}bellEl=document.getElementById("bell");safeRender();try{var p=initSync();if(p&&p.catch)p.catch(function(){});}catch(e){}}
boot();
})();
</script>
